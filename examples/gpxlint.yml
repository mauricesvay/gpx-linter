rules:
  max_slope:
    enabled: true
    severity: error
    params:
      max_slope_percentage: 25
      min_segment_meters: 3
      min_elevation_delta_meters: 1.5

  contraflow_bike:
    enabled: true
    severity: error

  roadworks:
    enabled: false
    severity: warning
    params:
      buffer_meters: 5

  sharp_turn:
    enabled: false
    severity: warning
    params:
      max_angle: 60
      min_segment_meters: 5
      min_heading_change_degrees: 0

  off_road:
    enabled: false
    severity: error
    params:
      max_distance_meters: 50

  missing_elevation:
    enabled: true
    severity: info
    params:
      max_missing_elevation_percentage: 50

  route_gaps:
    enabled: false
    severity: info
    params:
      max_gap_meters: 500

  loop_closure:
    enabled: false
    severity: info
    params:
      max_return_distance_meters: 100

route_context:
  loop_expected: false
  ferry_allowed: false

routing:
  provider: overpass
  cache: true

reporting:
  format: text
  color: auto
